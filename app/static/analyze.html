<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analyze a file</title>
<style>
:root{--bg:#eef1f4;--ink:#14202b;--mute:#5b6b7a;--line:#d3dae1;--card:#fff;--acc:#0b6e8a;--warn:#b4541a}
@media(prefers-color-scheme:dark){:root{--bg:#0f161d;--ink:#e6edf3;--mute:#8fa1b2;--line:#25323e;--card:#16212b;--acc:#4cb3d1;--warn:#e08a52}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 64px}h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:24px 0 10px}
.sub{color:var(--mute);margin:0 0 16px}a{color:var(--acc)}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:9px 14px;font:inherit;cursor:pointer}
button.alt{background:transparent;color:var(--acc);border:1px solid var(--acc);padding:5px 10px;font-size:13px}
input[type=text]{flex:1;min-width:220px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px;font:inherit}
input[type=file]{color:var(--ink)}button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.tile,.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.tile b{display:block;font-size:26px}.tile span{color:var(--mute);font-size:13px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
pre{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto}.err{color:var(--warn)}
</style></head><body><main>
<h1>Analyze your own file</h1>
<p class="sub">Upload an Excel (.xlsx) or CSV file. Rows, duplicates and missing values are counted instantly; questions are answered with SQL written by the AI. <a href="/">Back to reconciliation</a></p>
<div class="bar"><input id="f" type="file" accept=".xlsx,.xlsm,.csv" aria-label="Choose file"><button id="up">Upload and analyze</button><span id="msg" class="sub" role="status"></span></div>
<div id="out"></div>
<div id="askbox" hidden>
<h2>Ask about this data</h2>
<div class="bar" id="chips"></div>
<div class="bar"><input id="q" type="text" aria-label="Question" placeholder="What is the average unit price per product?"><button id="ask">Ask</button></div>
<div id="ans"></div></div>
</main><script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const api=async(p,o)=>{const r=await fetch(p,o);const t=await r.text();let j=null;try{j=JSON.parse(t)}catch{}if(!r.ok)throw new Error((j&&j.detail)||t||r.statusText);return j};
const say=(t,bad)=>{$('#msg').textContent=t;$('#msg').className='sub'+(bad?' err':'')};
const table=(cols,rows)=>`<div class="panel scroll"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+cols.map(c=>`<td>${esc(r[c])}</td>`).join('')+'</tr>').join('')}</tbody></table></div>`;
function show(p){
  $('#out').innerHTML=p.tables.map(t=>`<h2>${esc(t.table)} <span class="sub">(from ${esc(p.filename)})</span></h2>
  <div class="tiles"><div class="tile"><b>${t.rows}</b><span>Rows</span></div><div class="tile"><b>${t.columns}</b><span>Columns</span></div>
  <div class="tile"><b>${t.duplicate_rows}</b><span>Duplicate rows</span></div><div class="tile"><b>${t.missing_cells}</b><span>Missing cells</span></div></div>
  ${table(['name','type','missing','missing_pct','unique','min','max','mean','median'],t.column_info)}
  ${t.duplicate_rows?`<h2>Duplicate rows (sample)</h2>${table(Object.keys(t.duplicate_sample[0]),t.duplicate_sample)}`:''}`).join('');
  const t=p.tables[0],num=t.column_info.find(c=>c.mean!==undefined);
  const qs=[`How many rows are in ${t.table}?`,`How many duplicate rows are in ${t.table}?`];
  if(num)qs.push(`What are the average, minimum and maximum of ${num.name}?`,`Show the top 5 rows by ${num.name}`);
  $('#chips').innerHTML=qs.map(q=>`<button class="alt" data-q="${esc(q)}">${esc(q)}</button>`).join('');
  document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>{$('#q').value=b.dataset.q;ask()});
  $('#askbox').hidden=false;
}
$('#up').onclick=async()=>{const f=$('#f').files[0];if(!f)return say('Choose a file first.',1);say('Uploading...');
  const fd=new FormData();fd.append('file',f);
  try{show(await api('/files/upload',{method:'POST',body:fd}));say('Done.')}catch(e){say(e.message,1)}};
async function ask(){$('#ans').innerHTML='Thinking...';
  try{const r=await api('/files/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:$('#q').value})});
    $('#ans').innerHTML=(r.answer?`<p><b>${esc(r.answer)}</b></p>`:'')+`<pre>${esc(r.sql)}</pre>`+(r.rows.length?table(r.columns,r.rows):'<p class="sub">No rows returned.</p>')}
  catch(e){$('#ans').innerHTML=`<p class="err">${esc(e.message)}</p>`}}
$('#ask').onclick=ask;
api('/files/profile').then(show).catch(()=>{});
</script></body></html>
