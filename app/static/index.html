<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recon AI</title>
<style>
:root{--bg:#eef1f4;--ink:#14202b;--mute:#5b6b7a;--line:#d3dae1;--card:#fff;--acc:#0b6e8a;--warn:#b4541a}
@media(prefers-color-scheme:dark){:root{--bg:#0f161d;--ink:#e6edf3;--mute:#8fa1b2;--line:#25323e;--card:#16212b;--acc:#4cb3d1;--warn:#e08a52}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:22px;margin:0 0 4px}p.sub{color:var(--mute);margin:0 0 20px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:9px 14px;font:inherit;cursor:pointer}
button.alt{background:transparent;color:var(--acc);border:1px solid var(--acc)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.tile,.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.tile b{display:block;font-size:26px}.tile span{color:var(--mute);font-size:13px}
.row{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.track{background:var(--line);height:10px;border-radius:5px}.fill{background:var(--acc);height:10px;border-radius:5px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}td.wrap{white-space:normal;min-width:260px}
input[type=text],select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px;font:inherit}
input[type=text]{flex:1;min-width:220px}h2{font-size:16px;margin:22px 0 10px}
pre{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto}.err{color:var(--warn)}
</style></head><body><main>
<h1>Payment reconciliation</h1>
<p class="sub">Match the ledger against the bank feed, triage mismatches with AI, and ask questions in plain English.</p>
<div class="bar"><button id="run">Run reconciliation</button><button id="tri" class="alt">Triage 20 exceptions</button><span id="msg" class="sub" role="status"></span></div>
<div class="tiles" id="tiles"></div>
<div class="panel"><div id="bars"></div></div>
<h2>Exceptions</h2>
<div class="bar"><select id="cat" aria-label="Filter by category"><option value="">All categories</option></select></div>
<div class="panel scroll"><table><thead><tr><th>Category</th><th>Reference</th><th>Merchant</th><th>Ledger</th><th>Bank</th><th>Diff</th><th>AI root cause</th><th>Suggested action</th></tr></thead><tbody id="ex"></tbody></table></div>
<h2>Ask the data</h2>
<div class="bar"><input id="q" type="text" aria-label="Question" placeholder="Which merchant has the most amount mismatches?"><button id="ask">Ask</button></div>
<div id="ans"></div>
</main><script>
const $=s=>document.querySelector(s);
const api=async(p,o)=>{const r=await fetch(p,o);const t=await r.text();let j;try{j=JSON.parse(t)}catch{j=null}if(!r.ok)throw new Error((j&&j.detail)||t||r.statusText);return j};
const say=(t,bad)=>{$('#msg').textContent=t;$('#msg').className='sub'+(bad?' err':'')};
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function load(){
  try{const s=await api('/stats');
    $('#tiles').innerHTML=[['Transactions',s.total],['Match rate',s.match_rate+'%'],['Amount outliers',s.anomalies],['AI mode',s.ai_enabled?'LLM':'Offline rules']].map(t=>`<div class="tile"><b>${t[1]}</b><span>${t[0]}</span></div>`).join('');
    const mx=Math.max(...s.by_category.map(c=>c.n));
    $('#bars').innerHTML=s.by_category.map(c=>`<div class="row"><span>${c.category}</span><div class="track"><div class="fill" style="width:${100*c.n/mx}%"></div></div><span>${c.n}</span></div>`).join('');
    const sel=$('#cat');if(sel.options.length==1)s.by_category.filter(c=>c.category!='matched').forEach(c=>sel.add(new Option(c.category,c.category)));
    const e=await api('/exceptions?limit=50&category='+sel.value);
    $('#ex').innerHTML=e.map(r=>`<tr><td>${r.category}</td><td>${esc(r.key)}</td><td>${esc(r.merchant)}</td><td>${r.ledger_amount??'-'}</td><td>${r.bank_amount??'-'}</td><td>${r.diff}</td><td class="wrap">${esc(r.ai_cause)||'-'}</td><td class="wrap">${esc(r.ai_action)||'-'}</td></tr>`).join('');
  }catch(e){say(e.message,1)}}
$('#run').onclick=async()=>{say('Running...');try{const r=await api('/reconcile',{method:'POST'});say(`Reconciled ${r.ledger_rows} ledger rows against ${r.bank_rows} bank rows.`);load()}catch(e){say(e.message,1)}};
$('#tri').onclick=async()=>{say('Triaging...');try{const r=await api('/triage?limit=20',{method:'POST'});say(`Triaged ${r.triaged} (${r.mode}).`);load()}catch(e){say(e.message,1)}};
$('#cat').onchange=load;
$('#ask').onclick=async()=>{$('#ans').innerHTML='';try{const r=await api('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:$('#q').value})});
  const k=r.rows[0]?Object.keys(r.rows[0]):[];
  $('#ans').innerHTML=`<pre>${esc(r.sql)}</pre><div class="panel scroll"><table><thead><tr>${k.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${r.rows.map(o=>'<tr>'+k.map(x=>`<td>${esc(o[x])}</td>`).join('')+'</tr>').join('')}</tbody></table></div>`}catch(e){$('#ans').innerHTML=`<p class="err">${esc(e.message)}</p>`}};
load();
</script></body></html>
